name: Update PosterTerritory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install requests beautifulsoup4

      - name: Update competition list
        run: |
          python scripts/update_competitions.py

      - name: Commit updated competition list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.json
          git diff --cached --quiet || git commit -m "Update PosterTerritory competitions"
          git push
