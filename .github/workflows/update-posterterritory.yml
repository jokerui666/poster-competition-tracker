name: Update PosterTerritory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install requests beautifulsoup4

      - name: Update PosterTerritory list
        run: |
          python scripts/update_competitions.py

      - name: Commit updated tracker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.json tracker_state.json
          git diff --cached --quiet || git commit -m "Update PosterTerritory tracker"
          git push
