<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JHENG CHANG CHEN — Poster Competition Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,"Noto Sans TC",sans-serif
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:28px 18px 60px
}

header{
  border-bottom:3px solid #111;
  padding-bottom:14px;
  margin-bottom:12px
}

h1{
  font-size:clamp(28px,5vw,48px);
  margin:0
}

.sub{
  color:#666;
  margin-top:5px
}

.stats{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin:18px 0;
  font-size:14px
}

.stats b{
  font-size:18px
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:12px 0 16px
}

button{
  border:1px solid #bbb;
  background:#fff;
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;
  cursor:pointer
}

button:hover{
  background:#f4f4f4
}

button.active{
  background:#111;
  color:#fff;
  border-color:#111
}

.update{
  margin-left:auto
}

.backend{
  border-color:#111;
  font-weight:700
}

.status{
  font-size:12px;
  color:#666;
  margin:8px 0
}

.ok{
  color:#16833b
}

.warn{
  color:#a56b00
}

.table{
  border-top:2px solid #111
}

.row{
  display:grid;
  grid-template-columns:
    46px
    minmax(260px,1fr)
    110px
    135px
    165px;

  gap:12px;
  align-items:center;

  padding:14px 5px;

  border-bottom:1px solid #ddd
}

.head{
  background:#f4f4f4;
  color:#666;
  font-size:11px;
  font-weight:700;
  padding:9px 5px
}

.title{
  font-size:14px;
  line-height:1.35
}

.title a{
  color:#111;
  text-decoration:none;
  font-weight:700
}

.title a:hover{
  text-decoration:underline
}

.titleZh{
  margin-top:4px;
  color:#777;
  font-size:12px;
  font-weight:400
}

.deadline,
.resultDate,
.result{
  font-size:12px;
  white-space:nowrap
}

.result{
  font-weight:700
}

.check{
  width:22px;
  height:22px;
  accent-color:#111;
  cursor:pointer
}

.resultBtn{
  width:100%;
  text-align:left
}

.pending{
  color:#777
}

.green{
  color:#16833b
}

.red{
  color:#c62828
}

.gold{
  color:#a56b00
}

.blue{
  color:#2457a6
}

.note{
  font-size:12px;
  color:#777;
  margin-top:10px;
  line-height:1.5
}

.countInfo{
  color:#777;
  margin-left:12px
}

dialog{
  border:0;
  border-radius:12px;
  padding:20px;
  max-width:420px;
  width:calc(100% - 30px);
  box-shadow:0 10px 40px #0003
}

dialog::backdrop{
  background:#0005
}

dialog button{
  margin-top:6px
}

.close{
  float:right
}

@media(max-width:760px){

  .row{
    grid-template-columns:
      40px
      minmax(180px,1fr)
      92px
      125px
  }

  .statuscol{
    display:none
  }

  .resultDate{
    display:none
  }

  .update{
    margin-left:0
  }
}
</style>
</head>

<body>

<main class="wrap">

<header>
  <h1>JHENG CHANG CHEN</h1>
  <div class="sub">2026 POSTER COMPETITION TRACKER</div>
</header>

<div class="stats">
  <span>已參加 <b id="joinedCount">0</b></span>
  <span>追蹤中 <b id="trackingCount">0</b></span>
  <span>入選 <b id="selectedCount">0</b></span>
  <span>得獎 <b id="winnerCount">0</b></span>
</div>

<div class="controls">

  <button class="active" data-filter="all">
    全部
  </button>

  <button data-filter="joined">
    我有參加
  </button>

  <button data-filter="pending">
    待公布
  </button>

  <button data-filter="result">
    已有結果
  </button>

  <button id="update" class="update">
    ↻ 更新比賽資料
  </button>

  <button id="backend" class="backend">
    ↗ 前往後台更新資料
  </button>

</div>

<div id="status" class="status"></div>

<div class="table">

  <div class="row head">
    <div>參加</div>
    <div>COMPETITION</div>
    <div>DEADLINE</div>
    <div>RESULT DATE</div>
    <div class="statuscol">我的結果</div>
  </div>

  <div id="list"></div>

</div>

<div class="note">
  英文比賽名稱可直接點擊前往該比賽官方網站。
  繁體中文名稱由後端資料自動產生。
  參加狀態與比賽結果會保存在此瀏覽器。
</div>

</main>

<dialog id="dlg">

  <button class="close" id="close">×</button>

  <h3>修改結果</h3>

  <button data-result="pending">
    🟡 待公布
  </button>
  <br>

  <button data-result="selected">
    🟢 入選
  </button>
  <br>

  <button data-result="honorable">
    🔵 優選／佳作
  </button>
  <br>

  <button data-result="winner">
    🏆 得獎
  </button>
  <br>

  <button data-result="not_selected">
    🔴 未入選
  </button>

</dialog>

<script>

const KEY = 'jheng-poster-v5';

let data = [];
let filter = 'all';
let editing = null;


/* =========================
   讀取 competitions.json
========================= */

async function load(){

  try{

    const response =
      await fetch('competitions.json?ts=' + Date.now(), {
        cache:'no-store'
      });

    if(!response.ok){
      throw new Error('JSON loading failed');
    }

    const fresh = await response.json();

    const old =
      JSON.parse(
        localStorage.getItem(KEY) || '{}'
      );

    data = fresh.map(x => {

      const record =
        old[x.title] || {};

      return {

        ...x,

        participating:
          !!record.participating,

        result:
          record.result ||
          x.result ||
          'pending',

        resultDate:
          record.resultDate ||
          x.resultDate ||
          ''

      };

    });

    render();

    document.getElementById('status').innerHTML =
      '<span class="ok">● 已載入最新資料</span>' +
      '<span class="countInfo">' +
      data.length +
      ' 場比賽</span>';

  }

  catch(error){

    console.error(error);

    document.getElementById('status').innerHTML =
      '<span class="warn">' +
      '目前無法讀取 competitions.json，請稍後重新整理。' +
      '</span>';

  }

}


/* =========================
   儲存使用者資料
========================= */

function persist(){

  const saved = {};

  data.forEach(x => {

    saved[x.title] = {

      participating:
        x.participating,

      result:
        x.result,

      resultDate:
        x.resultDate

    };

  });

  localStorage.setItem(
    KEY,
    JSON.stringify(saved)
  );

}


/* =========================
   日期格式
========================= */

function fmt(d){

  return d
    ? d.replaceAll('-','/')
    : '—';

}


/* =========================
   HTML 安全處理
========================= */

function esc(s){

  return String(s || '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* =========================
   取得繁體中文名稱
   相容不同欄位名稱
========================= */

function getChineseTitle(x){

  return (
    x.traditionalChineseTitle ||
    x.titleZh ||
    x.title_zh ||
    x.chineseTitle ||
    x.zhTitle ||
    ''
  );

}


/* =========================
   結果文字
========================= */

function label(r){

  return {

    pending:
      '🟡 待公布',

    selected:
      '🟢 入選',

    honorable:
      '🔵 優選／佳作',

    winner:
      '🏆 得獎',

    not_selected:
      '🔴 未入選'

  }[r] || '🟡 待公布';

}


/* =========================
   結果顏色
========================= */

function cls(r){

  if(r === 'winner')
    return 'gold';

  if(r === 'selected')
    return 'green';

  if(r === 'honorable')
    return 'blue';

  if(r === 'not_selected')
    return 'red';

  return 'pending';

}


/* =========================
   產生列表
========================= */

function render(){

  const rows =
    data.filter(x => {

      if(filter === 'all')
        return true;

      if(filter === 'joined')
        return x.participating;

      if(filter === 'pending')
        return (
          x.participating &&
          x.result === 'pending'
        );

      if(filter === 'result')
        return (
          x.participating &&
          x.result !== 'pending'
        );

      return true;

    });


  document.getElementById('list').innerHTML =
    rows.map(x => {

      const chinese =
        getChineseTitle(x);

      const website =
        x.url || '#';

      return `

        <div class="row">

          <div>
            <input
              class="check"
              type="checkbox"
              ${x.participating ? 'checked' : ''}
              data-id="${esc(x.title)}"
            >
          </div>


          <div class="title">

            <a
              href="${esc(website)}"
              target="_blank"
              rel="noopener noreferrer"
              title="前往比賽官方網站"
            >
              ${esc(x.title)}
            </a>

            ${
              chinese
              ? `
                <div class="titleZh">
                  ${esc(chinese)}
                </div>
              `
              : ''
            }

          </div>


          <div class="deadline">
            ${fmt(x.deadline)}
          </div>


          <div class="resultDate">
            ${fmt(x.resultDate)}
          </div>


          <div class="statuscol">

            <button
              class="resultBtn ${cls(x.result)}"
              data-result-id="${esc(x.title)}"
            >
              ${label(x.result)}
            </button>

          </div>

        </div>

      `;

    }).join('');


  /* =========================
     勾選參加
  ========================= */

  document
    .querySelectorAll('.check')
    .forEach(c => {

      c.onchange = () => {

        const x =
          data.find(
            a => a.title === c.dataset.id
          );

        if(x){

          x.participating =
            c.checked;

          persist();
          render();

        }

      };

    });


  /* =========================
     修改結果
  ========================= */

  document
    .querySelectorAll('[data-result-id]')
    .forEach(b => {

      b.onclick = () => {

        editing =
          data.find(
            x =>
              x.title ===
              b.dataset.resultId
          );

        document
          .getElementById('dlg')
          .showModal();

      };

    });


  /* =========================
     統計
  ========================= */

  const joined =
    data.filter(
      x => x.participating
    );

  document.getElementById(
    'joinedCount'
  ).textContent =
    joined.length;

  document.getElementById(
    'trackingCount'
  ).textContent =
    joined.filter(
      x => x.result === 'pending'
    ).length;

  document.getElementById(
    'selectedCount'
  ).textContent =
    joined.filter(
      x =>
        ['selected','honorable']
        .includes(x.result)
    ).length;

  document.getElementById(
    'winnerCount'
  ).textContent =
    joined.filter(
      x => x.result === 'winner'
    ).length;

}


/* =========================
   篩選按鈕
========================= */

document
  .querySelectorAll('[data-filter]')
  .forEach(b => {

    b.onclick = () => {

      filter =
        b.dataset.filter;

      document
        .querySelectorAll('[data-filter]')
        .forEach(x =>
          x.classList.remove('active')
        );

      b.classList.add('active');

      render();

    };

  });


/* =========================
   結果選擇
========================= */

document
  .querySelectorAll('[data-result]')
  .forEach(b => {

    b.onclick = () => {

      if(editing){

        editing.result =
          b.dataset.result;

        persist();

        document
          .getElementById('dlg')
          .close();

        render();

      }

    };

  });


/* =========================
   關閉視窗
========================= */

document.getElementById(
  'close'
).onclick = () => {

  document
    .getElementById('dlg')
    .close();

};


/* =========================
   更新前端資料
========================= */

document.getElementById(
  'update'
).onclick = async () => {

  const status =
    document.getElementById('status');

  status.innerHTML =
    '<span class="warn">● 正在重新讀取比賽資料……</span>';

  await load();

};


/* =========================
   前往 GitHub Actions 後台
========================= */

document.getElementById(
  'backend'
).onclick = () => {

  window.open(
    'https://github.com/jokerui666/poster-competition-tracker/actions/workflows/update-posterterritory.yml',
    '_blank'
  );

};


/* =========================
   啟動
========================= */

load();

</script>

</body>
</html>
