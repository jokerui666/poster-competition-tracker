<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JHENG CHANG CHEN — Poster Competition Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,"Noto Sans TC",sans-serif
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:28px 18px 60px
}

header{
  border-bottom:3px solid #111;
  padding-bottom:14px;
  margin-bottom:12px
}

h1{
  font-size:clamp(28px,5vw,48px);
  margin:0
}

.sub{
  color:#666;
  margin-top:5px
}

.stats{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin:18px 0;
  font-size:14px
}

.stats b{
  font-size:18px
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:12px 0 16px
}

button{
  border:1px solid #bbb;
  background:#fff;
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;
  cursor:pointer
}

button.active{
  background:#111;
  color:#fff;
  border-color:#111
}

.update{
  margin-left:auto
}

.table{
  border-top:2px solid #111
}

.row{
  display:grid;
  grid-template-columns:
    46px
    minmax(260px,1fr)
    110px
    135px
    165px;

  gap:12px;
  align-items:center;
  padding:14px 5px;
  border-bottom:1px solid #ddd
}

.head{
  background:#f4f4f4;
  color:#666;
  font-size:11px;
  font-weight:700;
  padding:9px 5px
}

.title{
  font-weight:700;
  font-size:14px;
  line-height:1.35
}

.deadline,
.resultDate,
.result{
  font-size:12px;
  white-space:nowrap
}

.result{
  font-weight:700
}

.check{
  width:22px;
  height:22px;
  accent-color:#111;
  cursor:pointer
}

.resultBtn{
  width:100%;
  text-align:left
}

.pending{
  color:#777
}

.green{
  color:#16833b
}

.red{
  color:#c62828
}

.gold{
  color:#a56b00
}

.blue{
  color:#2457a6
}

.note{
  font-size:12px;
  color:#777;
  margin-top:10px;
  line-height:1.5
}

.status{
  font-size:12px;
  color:#666;
  margin:8px 0
}

.ok{
  color:#16833b
}

.warn{
  color:#a56b00
}

dialog{
  border:0;
  border-radius:12px;
  padding:20px;
  max-width:420px;
  width:calc(100% - 30px);
  box-shadow:0 10px 40px #0003
}

dialog::backdrop{
  background:#0005
}

dialog button{
  margin-top:6px
}

.close{
  float:right
}

@media(max-width:760px){

  .row{
    grid-template-columns:
      40px
      minmax(180px,1fr)
      92px
      125px
  }

  .statuscol{
    display:none
  }
}
</style>
</head>

<body>

<main class="wrap">

<header>
  <h1>JHENG CHANG CHEN</h1>
  <div class="sub">2026 POSTER COMPETITION TRACKER</div>
</header>


<div class="stats">

  <span>
    已參加
    <b id="joinedCount">0</b>
  </span>

  <span>
    追蹤中
    <b id="trackingCount">0</b>
  </span>

  <span>
    入選
    <b id="selectedCount">0</b>
  </span>

  <span>
    得獎
    <b id="winnerCount">0</b>
  </span>

</div>


<div class="controls">

  <button class="active" data-filter="all">
    全部
  </button>

  <button data-filter="joined">
    我有參加
  </button>

  <button data-filter="pending">
    待公布
  </button>

  <button data-filter="result">
    已有結果
  </button>

  <button id="update" class="update">
    ↻ 更新比賽資料
  </button>

</div>


<div id="status" class="status"></div>


<div class="table">

  <div class="row head">

    <div>參加</div>

    <div>COMPETITION</div>

    <div>DEADLINE</div>

    <div>RESULT DATE</div>

    <div class="statuscol">
      我的結果
    </div>

  </div>

  <div id="list"></div>

</div>


<div class="note">
  「↻ 更新比賽資料」會提醒你到 GitHub Actions
  執行一次更新；網站本身不會連線 PosterTerritory。
  Action 更新完成並部署後，本頁會自動偵測新的
  competitions.json 並更新畫面。
  你的參加勾選與結果會保存在瀏覽器。
</div>

</main>


<dialog id="dlg">

  <button class="close" id="close">
    ×
  </button>

  <h3>修改結果</h3>

  <button data-result="pending">
    🟡 待公布
  </button>
  <br>

  <button data-result="selected">
    🟢 入選
  </button>
  <br>

  <button data-result="honorable">
    🔵 優選／佳作
  </button>
  <br>

  <button data-result="winner">
    🏆 得獎
  </button>
  <br>

  <button data-result="not_selected">
    🔴 未入選
  </button>

</dialog>


<script>

const KEY = 'jheng-poster-v4';

/*
  前端只讀取 competitions.json
  不會直接連線 PosterTerritory
*/

let data = [];

let filter = 'all';

let editing = null;


/* ================================
   讀取最新 competitions.json
   ================================ */

async function load(){

  try{

    const response = await fetch(
      'competitions.json?t=' + Date.now(),
      {
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }

    const fresh =
      await response.json();

    if(!Array.isArray(fresh)){
      throw new Error(
        'competitions.json 格式錯誤'
      );
    }


    /*
      讀取瀏覽器原本保存的
      參加狀態與結果
    */

    const old =
      JSON.parse(
        localStorage.getItem(KEY) || '{}'
      );


    /*
      最新 JSON + 原本使用者資料
    */

    data = fresh.map(x => {

      const saved =
        old[x.title] || {};

      return {

        ...x,

        participating:
          typeof saved.participating === 'boolean'
            ? saved.participating
            : !!x.participating,

        result:
          saved.result ||
          x.result ||
          'pending',

        resultDate:
          saved.resultDate ||
          x.resultDate ||
          ''

      };

    });


    render();


    /*
      顯示目前資料數量與更新時間
    */

    const now =
      new Date();

    const time =
      now.toLocaleTimeString(
        'zh-TW',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      );


    document.getElementById(
      'status'
    ).innerHTML =
      '<span class="ok">● 已載入最新資料</span>' +
      '　' +
      data.length +
      ' 場比賽' +
      '　｜最後更新 ' +
      time;


  }catch(error){

    console.error(
      'Competition data error:',
      error
    );


    document.getElementById(
      'status'
    ).innerHTML =
      '<span class="warn">' +
      '目前無法讀取最新資料，請稍後重新整理。' +
      '</span>';

  }

}


/* ================================
   保存使用者資料
   ================================ */

function persist(){

  const saved = {};

  data.forEach(x => {

    saved[x.title] = {

      participating:
        x.participating,

      result:
        x.result,

      resultDate:
        x.resultDate

    };

  });


  localStorage.setItem(
    KEY,
    JSON.stringify(saved)
  );

}


/* ================================
   日期格式
   ================================ */

function fmt(d){

  return d
    ? d.replaceAll('-','/')
    : '—';

}


/* ================================
   HTML 安全處理
   ================================ */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* ================================
   結果文字
   ================================ */

function label(result){

  return {

    pending:
      '🟡 待公布',

    selected:
      '🟢 入選',

    honorable:
      '🔵 優選／佳作',

    winner:
      '🏆 得獎',

    not_selected:
      '🔴 未入選'

  }[result] ||
    '🟡 待公布';

}


/* ================================
   結果顏色
   ================================ */

function cls(result){

  if(result === 'winner'){
    return 'gold';
  }

  if(result === 'selected'){
    return 'green';
  }

  if(result === 'honorable'){
    return 'blue';
  }

  if(result === 'not_selected'){
    return 'red';
  }

  return 'pending';

}


/* ================================
   顯示比賽
   ================================ */

function render(){

  const rows =
    data.filter(x => {

      if(filter === 'all'){
        return true;
      }

      if(filter === 'joined'){
        return x.participating;
      }

      if(filter === 'pending'){
        return (
          x.participating &&
          x.result === 'pending'
        );
      }

      if(filter === 'result'){
        return (
          x.participating &&
          x.result !== 'pending'
        );
      }

      return true;

    });


  document.getElementById(
    'list'
  ).innerHTML =
    rows.map(x => `

      <div class="row">

        <div>

          <input
            class="check"
            type="checkbox"
            ${x.participating ? 'checked' : ''}
            data-id="${esc(x.title)}"
          >

        </div>


        <div class="title">
          ${esc(x.title)}
        </div>


        <div class="deadline">
          ${fmt(x.deadline)}
        </div>


        <div class="resultDate">
          ${fmt(x.resultDate)}
        </div>


        <div class="statuscol">

          <button
            class="resultBtn ${cls(x.result)}"
            data-result-id="${esc(x.title)}"
          >
            ${label(x.result)}
          </button>

        </div>

      </div>

    `).join('');


  /*
    勾選參加
  */

  document
    .querySelectorAll('.check')
    .forEach(check => {

      check.onchange = () => {

        const item =
          data.find(
            x =>
              x.title ===
              check.dataset.id
          );

        if(!item){
          return;
        }

        item.participating =
          check.checked;

        persist();

        render();

      };

    });


  /*
    修改結果
  */

  document
    .querySelectorAll('[data-result-id]')
    .forEach(button => {

      button.onclick = () => {

        editing =
          data.find(
            x =>
              x.title ===
              button.dataset.resultId
          );

        if(editing){

          document
            .getElementById('dlg')
            .showModal();

        }

      };

    });


  /*
    統計
  */

  const joined =
    data.filter(
      x => x.participating
    );


  document.getElementById(
    'joinedCount'
  ).textContent =
    joined.length;


  document.getElementById(
    'trackingCount'
  ).textContent =
    joined.filter(
      x => x.result === 'pending'
    ).length;


  document.getElementById(
    'selectedCount'
  ).textContent =
    joined.filter(
      x =>
        ['selected','honorable']
        .includes(x.result)
    ).length;


  document.getElementById(
    'winnerCount'
  ).textContent =
    joined.filter(
      x => x.result === 'winner'
    ).length;

}


/* ================================
   篩選
   ================================ */

document
  .querySelectorAll('[data-filter]')
  .forEach(button => {

    button.onclick = () => {

      filter =
        button.dataset.filter;


      document
        .querySelectorAll('[data-filter]')
        .forEach(x =>
          x.classList.remove('active')
        );


      button.classList.add(
        'active'
      );


      render();

    };

  });


/* ================================
   修改結果
   ================================ */

document
  .querySelectorAll('[data-result]')
  .forEach(button => {

    button.onclick = () => {

      if(!editing){
        return;
      }


      editing.result =
        button.dataset.result;


      persist();


      document
        .getElementById('dlg')
        .close();


      render();

    };

  });


/* ================================
   關閉結果視窗
   ================================ */

document.getElementById(
  'close'
).onclick = () => {

  document
    .getElementById('dlg')
    .close();

};


/* ================================
   手動重新讀取 JSON
   ================================ */

document.getElementById(
  'update'
).onclick = async () => {

  const button =
    document.getElementById(
      'update'
    );


  button.disabled = true;

  button.textContent =
    '↻ 讀取中…';


  await load();


  button.disabled = false;

  button.textContent =
    '↻ 更新比賽資料';

};


/* ================================
   第一次載入
   ================================ */

load();


/* ==================================================
   自動偵測 competitions.json 是否更新
   ==================================================

   注意：
   這裡不是連 PosterTerritory。

   只是每 1 分鐘檢查一次自己網站上的
   competitions.json。

   如果資料沒有變化：
       → 什麼都不做

   如果資料有變化：
       → load()
       → render()
       → 前端自動更新
*/

let lastDataSignature = '';


async function checkForUpdates(){

  try{

    const response =
      await fetch(
        'competitions.json?t=' +
        Date.now(),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return;
    }


    const fresh =
      await response.json();


    if(!Array.isArray(fresh)){
      return;
    }


    /*
      只比較真正會影響比賽列表的資料
    */

    const signature =
      JSON.stringify(
        fresh.map(x => ({
          title:x.title,
          deadline:x.deadline,
          resultDate:x.resultDate,
          url:x.url
        }))
      );


    /*
      第一次檢查只建立基準
    */

    if(!lastDataSignature){

      lastDataSignature =
        signature;

      return;

    }


    /*
      沒有變化
    */

    if(
      signature ===
      lastDataSignature
    ){

      return;

    }


    /*
      發現 competitions.json 已更新
    */

    console.log(
      '偵測到最新比賽資料，正在更新前端……'
    );


    lastDataSignature =
      signature;


    await load();


    console.log(
      '前端更新完成，共',
      data.length,
      '場比賽'
    );


  }catch(error){

    console.log(
      '自動檢查資料失敗：',
      error
    );

  }

}


/*
  每 1 分鐘檢查一次
*/

setInterval(
  checkForUpdates,
  60 * 1000
);


/*
  網頁開啟後稍微延遲一次檢查
*/

setTimeout(
  checkForUpdates,
  3000
);

</script>

</body>
</html>
